### Hibernate / JPA
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

### Session Management (JDBC)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=600
server.servlet.session.cookie.name=MY_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
#server.servlet.session.cookie.secure=true....Use secure=true only in production behind HTTPS (e.g. with reverse proxies or SSL certs).

### Multipart (File Upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=C:/Users/PSDT/Documents/correspondence_files
# Use Docker-friendly Linux path; map volume in docker-compose.yml
#file.upload-dir=/acfes_files

### Static Resources & Templates
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:/tmp/
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

