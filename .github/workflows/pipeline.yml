# this one for backend.
# for frontend just make these jobs: Build docker image [checkout code, extract project version, login to dockerhub, build & push to dockerhub] and Deploy frontend [create deployment folder, copy docker compose file, set env variables and deploy]
name: api_pipeline

on:
    push:
        branches:
            - feature-a-branch
        paths:
            - src/**
            - 'Dockerfile'
            - 'docker-compose.yml'
            - .github/workflows/pipeline.yml
            
jobs:
    compile:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Compile project
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with: #environment variables
                fetch-depth: 0 
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Compile project
              run: |
                mvn clean compile
 
    # Assumming you have unit tests 
    unit-tests:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Unit tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Running unit tests
              run: |
                mvn clean test  

    build:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build backend
        needs: [compile,unit-tests] #depends on
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Build project
              run: |
                mvn clean package
              
    build-image:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build docker image
        needs: [build]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Extract project version
              id: extract_version
              #For Linux
              #run: |
              #  echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
              
              #For Windows
              #run: |                
              #  $version = & mvn help:evaluate -Dexpression=project.version -q -DforceStdout; "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              run: |                
                $version = "1.0.0"
                "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}    
          
            - name: Build and push to DockerHub
              uses: docker/build-push-action@v5
              with:
                context: .
                file: Dockerfile #file to execute
                push: true
                platforms: linux/amd64
                #tags: ${{secrets.DOCKERHUB_USERNAME}}/bsn-api:${{steps.extract_version.outputs.VERSION}},${{secrets.DOCKERHUB_USERNAME}}/bsn-api:latest
                tags: ${{secrets.DOCKERHUB_USERNAME}}/pipelinedemo:latest
                build-args: |
                    PROFILE=dev
                    APP_VERSION=${{steps.extract_version.outputs.VERSION}}
    
    ##this job only for "runs-on: self-hosted" not "runs-on: ubuntu-latest"
    ##For Linux
    #deploy:
    #    #runs-on: self-hosted
    #    #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
    #    runs-on: [self-hosted, Windows]
    #    name: Deploy backend
    #    needs: [build-image]
    #    steps:
    #        #- name: Create deployment folder
    #        #  run: ssh ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} "mkdir -p ci-cd"
    #            
    #        #- name: Copy docker-compose file
    #        #  run: scp docker-compose.yml ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}}:ci-cd/docker-compose.yml
    #                
    #        - name: Set environment variables and deploy
    #          #<<EOF....EOF is for multiple line commands
    #          run: |
    #            ssh ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} <<EOF
    #            cd ci-cd
    #            docker-compose -f docker-compose.yml pull -q
    #            docker-compose -f docker-compose.yml up -d
    #            EOF
    
    ##this job only for "runs-on: self-hosted" not "runs-on: ubuntu-latest"
    ##For Windows
    deploy:
        runs-on: [self-hosted, Windows]
        name: Deploy backend
        needs: [build-image]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Deployment Folder and Deploy
              shell: cmd
              run: |
                :: 1. Use PowerShell in a single line to write the key correctly
                powershell -Command "$key = '${{ secrets.SSH_PRIVATE_KEY }}'; $key | Out-File -FilePath deploy_key.pem -Encoding ascii"

                :: 2. Fix Permissions
                icacls deploy_key.pem /inheritance:r
                icacls deploy_key.pem /grant:r "%USERNAME%":"(R)"

                :: 3. SSH Commands (Using the settings your VPS needs)
                ssh -i deploy_key.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o MACs=hmac-sha1 -c aes128-cbc -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} "if not exist ci-cd mkdir ci-cd"

                scp -i deploy_key.pem -o StrictHostKeyChecking=no -o MACs=hmac-sha1 -c aes128-cbc -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa docker-compose.yml ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}}:ci-cd/docker-compose.yml

                ssh -i deploy_key.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o MACs=hmac-sha1 -c aes128-cbc -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} "cd ci-cd && docker compose pull && docker compose up -d"

                :: 4. Cleanup
                del deploy_key.pem