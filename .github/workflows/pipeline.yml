# this one for backend..
# for frontend just make these jobs: Build docker image [checkout code, extract project version, login to dockerhub, build & push to dockerhub] and Deploy frontend [create deployment folder, copy docker compose file, set env variables and deploy]
name: api_pipeline

on:
    push:
        branches:
            - feature-a-branch
        paths:
            - src/**
            - 'Dockerfile'
            - 'docker-compose.yml'
            - .github/workflows/pipeline.yml
            
jobs:
    compile:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Compile project
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with: #environment variables
                fetch-depth: 0 
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Compile project
              run: |
                mvn clean compile
 
    # Assumming you have unit tests 
    unit-tests:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Unit tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Running unit tests
              run: |
                mvn clean test  

    build:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build backend
        needs: [compile,unit-tests] #depends on
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Build project
              run: |
                mvn clean package
              
    build-image:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build docker image
        needs: [build]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Extract project version
              id: extract_version
              #For Linux
              #run: |
              #  echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
              
              #For Windows
              #run: |                
              #  $version = & mvn help:evaluate -Dexpression=project.version -q -DforceStdout; "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              run: |                
                $version = "1.0.0"
                "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}    
          
            - name: Build and push to DockerHub
              uses: docker/build-push-action@v5
              with:
                context: .
                file: Dockerfile #file to execute
                push: true
                platforms: linux/amd64
                #tags: ${{secrets.DOCKERHUB_USERNAME}}/bsn-api:${{steps.extract_version.outputs.VERSION}},${{secrets.DOCKERHUB_USERNAME}}/bsn-api:latest
                tags: ${{secrets.DOCKERHUB_USERNAME}}/pipelinedemo:latest
                build-args: |
                    PROFILE=dev
                    APP_VERSION=${{steps.extract_version.outputs.VERSION}}
    
    ##this job only for "runs-on: ubuntu-latest" not "runs-on: self-hosted" (for testing)
    ##For Linux
    deploy:
        runs-on: ubuntu-latest
        name: Deploy backend (Test)
        needs: [build-image]

        steps:
            - name: Create deployment folder
            run: mkdir -p ci-cd

            - name: Copy docker-compose file
            run: cp docker-compose.yml ci-cd/

            - name: Verify docker-compose file exists
            run: |
                if [ -f ci-cd/docker-compose.yml ]; then
                    echo "docker-compose.yml exists ✅"
                else
                    echo "docker-compose.yml NOT found ❌"
                    exit 1
                fi

            - name: Deploy application (test)
            run: |
                cd ci-cd
                docker compose pull || echo "No images yet, skipping pull"
                docker compose up -d --remove-orphans
                docker image prune -f        
    
    ##this job only for "runs-on: self-hosted" not "runs-on: ubuntu-latest"
    ##For Linux
    deploy:
        runs-on: [self-hosted, Linux]
        name: Deploy backend
        needs: [build-image]

        steps:
            - name: Create deployment folder
              run: |
                ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
                "mkdir -p ~/ci-cd"

            - name: Copy docker-compose file
              run: |
                scp -o StrictHostKeyChecking=no docker-compose.yml \
                ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/ci-cd/docker-compose.yml

            - name: Deploy application
            run: |
                ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
                    cd ~/ci-cd
                    docker compose pull
                    docker compose up -d --remove-orphans
                    docker image prune -f
                EOF
    
