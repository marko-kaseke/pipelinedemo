# this one for backend.
# for frontend just make these jobs: Build docker image [checkout code, extract project version, login to dockerhub, build & push to dockerhub] and Deploy frontend [create deployment folder, copy docker compose file, set env variables and deploy]
name: api_pipeline

on:
    push:
        branches:
            - feature-a-branch
        paths:
            - src/**
            - 'Dockerfile'
            - 'docker-compose.yml'
            - .github/workflows/pipeline.yml
            
jobs:
    compile:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Compile project
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with: #environment variables
                fetch-depth: 0 
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Compile project
              run: |
                mvn clean compile
 
    # Assumming you have unit tests 
    unit-tests:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Unit tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Running unit tests
              run: |
                mvn clean test  

    build:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build backend
        needs: [compile,unit-tests] #depends on
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Build project
              run: |
                mvn clean package
              
    build-image:
        #runs-on: self-hosted
        #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
        runs-on: [self-hosted, Windows]
        name: Build docker image
        needs: [build]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: 'corretto'
                
            - name: Extract project version
              id: extract_version
              #For Linux
              #run: |
              #  echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
              
              #For Windows
              #run: |                
              #  $version = & mvn help:evaluate -Dexpression=project.version -q -DforceStdout; "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              run: |                
                $version = "1.0.0"
                "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}    
          
            - name: Build and push to DockerHub
              uses: docker/build-push-action@v5
              with:
                context: .
                file: Dockerfile #file to execute
                push: true
                platforms: linux/amd64
                #tags: ${{secrets.DOCKERHUB_USERNAME}}/bsn-api:${{steps.extract_version.outputs.VERSION}},${{secrets.DOCKERHUB_USERNAME}}/bsn-api:latest
                tags: ${{secrets.DOCKERHUB_USERNAME}}/pipelinedemo:latest
                build-args: |
                    PROFILE=dev
                    APP_VERSION=${{steps.extract_version.outputs.VERSION}}
    
    ##this job only for "runs-on: self-hosted" not "runs-on: ubuntu-latest"
    ##For Linux
    #deploy:
    #    #runs-on: self-hosted
    #    #runs-on: ubuntu-latest #github vm (temporary and for testing the pipeline)
    #    runs-on: [self-hosted, Windows]
    #    name: Deploy backend
    #    needs: [build-image]
    #    steps:
    #        #- name: Create deployment folder
    #        #  run: ssh ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} "mkdir -p ci-cd"
    #            
    #        #- name: Copy docker-compose file
    #        #  run: scp docker-compose.yml ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}}:ci-cd/docker-compose.yml
    #                
    #        - name: Set environment variables and deploy
    #          #<<EOF....EOF is for multiple line commands
    #          run: |
    #            ssh ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} <<EOF
    #            cd ci-cd
    #            docker-compose -f docker-compose.yml pull -q
    #            docker-compose -f docker-compose.yml up -d
    #            EOF
    
    ##this job only for "runs-on: self-hosted" not "runs-on: ubuntu-latest"
    ##For Windows.
    deploy:
        runs-on: [self-hosted, Windows]
        name: Deploy backend
        needs: [build-image]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Deployment Folder and Deploy
              shell: powershell
              env:
                MY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              run: |
                # 1. Save the SSH key
                $keyPath = "$env:TEMP\deploy_key"
                $env:MY_KEY | Set-Content -Encoding Ascii $keyPath
                icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)"

                # 2. Define SSH options as an ARRAY (This is the critical fix)
                $ssh_args = @(
                    "-i", $keyPath,
                    "-c", "aes128-cbc,aes192-cbc,aes256-cbc,3des-cbc",
                    "-o", "KexAlgorithms=+diffie-hellman-group14-sha1",
                    "-o", "HostKeyAlgorithms=+ssh-rsa",
                    "-o", "MACs=hmac-sha1,hmac-sha1-96,hmac-md5,hmac-md5-96",
                    "-o", "StrictHostKeyChecking=no"
                )

                $vps = "${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}}"

                # 3. Create remote folder
                & ssh @ssh_args $vps "mkdir -p ci-cd"

                # 4. Copy docker-compose.yml
                $remoteDest = $vps + ":ci-cd/docker-compose.yml"
                & scp @ssh_args docker-compose.yml $remoteDest

                # 5. Pull and run Docker
                & ssh @ssh_args $vps "cd ci-cd && docker compose pull && docker compose up -d"

                # 6. Clean up
                if (Test-Path $keyPath) { Remove-Item $keyPath -Force }